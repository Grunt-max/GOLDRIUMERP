<div class="workspace-field{% if wide %} field-wide{% endif %}{% if compact %} field-compact{% endif %}">
  <label for="{{ field.id_for_label }}">{{ label|default:field.label }}{% if field.field.required %}<em>*</em>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<small class="field-help">{{ field.help_text|safe }}</small>{% endif %}
  {{ field.errors }}
</div>

<div class="modal" id="{{ modal_id }}"><div class="modal-box"><div class="modal-head"><h2>{{ modal_title }}</h2><button type="button" class="icon-button" data-modal-close>×</button></div><form method="post" action="{{ action }}" enctype="multipart/form-data">{% csrf_token %}{% for field in form %}<label>{{ field.label }}{{ field }}{% if field.errors %}<em>{{ field.errors|striptags }}</em>{% endif %}</label>{% endfor %}<div class="modal-actions"><button type="button" class="secondary" data-modal-close>취소</button><button type="submit">저장하기</button></div></form></div></div>

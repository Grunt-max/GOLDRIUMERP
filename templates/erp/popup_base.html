{% load static %}
<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Simple ERP{% endblock %}</title><link rel="stylesheet" href="{% static 'erp/style.css' %}"><link rel="stylesheet" href="{% static 'erp/sales.css' %}"></head>
<body class="popup-body"><main class="popup-main">{% if messages %}<div class="messages">{% for message in messages %}<p class="message {{ message.tags }}">{{ message }}</p>{% endfor %}</div>{% endif %}{% block content %}{% endblock %}</main></body></html>

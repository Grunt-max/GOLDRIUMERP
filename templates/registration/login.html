{% load static %}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>골드리움 킹 로그인</title>
  <link rel="stylesheet" href="{% static 'erp/style.css' %}">
</head>
<body class="login-body">
  <main class="login-card">
    <header>
      <strong>골드리움 킹</strong>
      <span>회사 통합 업무관리 시스템</span>
    </header>
    {% if form.errors %}<p class="login-error">아이디 또는 비밀번호가 올바르지 않습니다.</p>{% endif %}
    <form method="post" class="login-form">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label>아이디<input type="text" name="username" value="{{ form.username.value|default:'' }}" autocomplete="username" autofocus required></label>
      <label>비밀번호<input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit">로그인</button>
    </form>
    {% if allow_initial_setup %}<a class="initial-setup-link" href="{% url 'initial_admin_setup' %}">최초 관리자 계정 만들기</a>{% endif %}
    <p>등록된 회사 계정으로 로그인하세요.</p>
  </main>
</body>
</html>
